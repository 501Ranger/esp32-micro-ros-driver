<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ESP32 机器人控制终端</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #080c14;
      --card-bg: rgba(18, 24, 38, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-color: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --error: #ef4444;
      --estop-yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      touch-action: none;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
    }

    header {
      width: 100%;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 12, 20, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      z-index: 10;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 18px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-nav-header {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-nav-header:active {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--accent-color);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--error);
      box-shadow: 0 0 8px var(--error);
    }

    .status-badge.connected .status-dot {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 16px;
      gap: 16px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    .dashboard-panel {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .stat-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(99, 102, 241, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-color);
    }

    .stat-content {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 14px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
    }

    .estop-section {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .estop-outer {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #fcd34d 0%, #d97706 100%);
      border: 5px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 8px 16px rgba(0,0,0,0.4),
        inset 0 2px 5px rgba(255,255,255,0.4);
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease;
    }

    .estop-outer:active {
      transform: scale(0.97);
    }

    .estop-button {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ef4444 0%, #991b1b 100%);
      border: 3px solid #7f1d1d;
      box-shadow: 
        inset 0 3px 5px rgba(255,255,255,0.3),
        0 4px 6px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
    }

    .estop-text-top {
      font-size: 10px;
      opacity: 0.8;
      margin-bottom: -2px;
    }

    .estop-outer.active {
      background: radial-gradient(circle, #fef08a 0%, #ca8a04 100%);
      animation: estop-glow 1s infinite alternate;
    }

    .estop-outer.active .estop-button {
      background: radial-gradient(circle at 35% 35%, #dc2626 0%, #b91c1c 100%);
      transform: translateZ(0) scale(0.92);
      box-shadow: 
        inset 0 5px 8px rgba(0,0,0,0.8),
        0 2px 3px rgba(0,0,0,0.3);
      border-color: #991b1b;
    }

    @keyframes estop-glow {
      0% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4), 0 8px 16px rgba(0,0,0,0.4); }
      100% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.8), 0 8px 16px rgba(0,0,0,0.4); }
    }

    .estop-label-text {
      position: absolute;
      bottom: -22px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .joystick-container {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .joystick-zone {
      position: relative;
      width: 220px;
      height: 220px;
      background: rgba(18, 24, 38, 0.4);
      border: 2px solid var(--card-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        inset 0 0 30px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      transition: border-color 0.3s ease;
    }

    .joystick-zone::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: 
        radial-gradient(circle, transparent 35%, rgba(99, 102, 241, 0.03) 36%, rgba(99, 102, 241, 0.03) 38%, transparent 39%),
        radial-gradient(circle, transparent 65%, rgba(99, 102, 241, 0.03) 66%, rgba(99, 102, 241, 0.03) 68%, transparent 69%);
      pointer-events: none;
    }

    .joystick-axis-h, .joystick-axis-v {
      position: absolute;
      background: rgba(255, 255, 255, 0.04);
      pointer-events: none;
    }
    .joystick-axis-h { width: 80%; height: 1px; }
    .joystick-axis-v { height: 80%; width: 1px; }

    .stick {
      position: absolute;
      width: 76px;
      height: 76px;
      background: radial-gradient(circle at 30% 30%, #374151 0%, #111827 100%);
      border: 2px solid #4b5563;
      border-radius: 50%;
      box-shadow: 
        0 10px 20px rgba(0,0,0,0.6),
        inset 0 2px 4px rgba(255,255,255,0.15);
      pointer-events: none;
      transition: transform 0.15s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stick::after {
      content: '';
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-gradient);
      box-shadow: 0 0 10px var(--accent-color);
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .stick.active {
      transition: none;
      border-color: var(--accent-color);
      box-shadow: 
        0 12px 24px rgba(99, 102, 241, 0.3),
        inset 0 2px 4px rgba(255,255,255,0.2);
    }

    .joystick-disabled .joystick-zone {
      border-color: var(--error);
      opacity: 0.5;
    }
    .joystick-disabled .stick {
      background: #1f2937;
      border-color: #374151;
      box-shadow: none;
    }
    .joystick-disabled .stick::after {
      background: #4b5563;
      box-shadow: none;
      opacity: 0.3;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #6366f1;">
        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
        <circle cx="12" cy="5" r="2"></circle>
        <path d="M12 7v4"></path>
        <line x1="8" y1="16" x2="8" y2="16"></line>
        <line x1="16" y1="16" x2="16" y2="16"></line>
      </svg>
      <span class="logo-text">ESP32 ROBOT</span>
    </div>
    <div class="header-actions">
      <a href="/wifi" class="btn-nav-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        <span>配置</span>
      </a>
      <div id="status-badge" class="status-badge">
        <div class="status-dot"></div>
        <span id="status-text">未连接</span>
      </div>
    </div>
  </header>

  <main>
    <div class="dashboard-panel">
      <div class="stat-card">
        <div class="stat-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect>
            <line x1="23" y1="11" x2="23" y2="13"></line>
          </svg>
        </div>
        <div class="stat-content">
          <span class="stat-label">电池电量</span>
          <span id="battery-value" class="stat-value" style="color: var(--text-muted);">-- % / -- V</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <div class="stat-content">
          <span class="stat-label">控制状态</span>
          <span id="control-state-val" class="stat-value">就绪</span>
        </div>
      </div>
    </div>

    <div class="estop-section">
      <div id="estop-btn" class="estop-outer">
        <div class="estop-button">
          <span class="estop-text-top">EMERGENCY</span>
          <span>STOP</span>
        </div>
        <span class="estop-label-text">急停按钮</span>
      </div>
    </div>

    <div id="joystick-wrapper" class="joystick-container">
      <div id="joystick-zone" class="joystick-zone">
        <div class="joystick-axis-h"></div>
        <div class="joystick-axis-v"></div>
        <div id="stick" class="stick"></div>
      </div>
    </div>
  </main>

  <script>
    let ws;
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const ctrlStateVal = document.getElementById('control-state-val');
    const zone = document.getElementById('joystick-zone');
    const stick = document.getElementById('stick');
    const estopBtn = document.getElementById('estop-btn');
    const joystickWrapper = document.getElementById('joystick-wrapper');

    let isDragging = false;
    let centerX, centerY;
    const maxRadius = 110 - 38;

    let outX = 0;
    let outY = 0;
    let isEstop = false;

    function connect() {
      ws = new WebSocket(`ws://${window.location.host}/ws`);
      
      ws.onopen = () => {
        statusBadge.classList.add('connected');
        statusText.innerText = "已连接";
      };
      
      ws.onclose = () => {
        statusBadge.classList.remove('connected');
        statusText.innerText = "未连接";
        setTimeout(connect, 1000);
      };
    }

    function sendCommand() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        if (isEstop) {
          ws.send(JSON.stringify({ x: 0, y: 0 }));
        } else if (isDragging || (outX === 0 && outY === 0)) {
          ws.send(JSON.stringify({ x: outX, y: outY }));
        }
      }
    }

    setInterval(sendCommand, 50);

    function updateStickPosition(clientX, clientY) {
      if (isEstop) return;
      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      
      if (distance > maxRadius) {
        const ratio = maxRadius / distance;
        dx *= ratio;
        dy *= ratio;
      }
      
      stick.style.transform = `translate(${dx}px, ${dy}px)`;
      
      outX = dx / maxRadius;
      outY = -(dy / maxRadius);
    }

    function resetStick() {
      isDragging = false;
      stick.classList.remove('active');
      stick.style.transform = 'translate(0px, 0px)';
      outX = 0;
      outY = 0;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ x: 0, y: 0 }));
      }
    }

    estopBtn.addEventListener('click', () => {
      isEstop = !isEstop;
      if (isEstop) {
        estopBtn.classList.add('active');
        joystickWrapper.classList.add('joystick-disabled');
        ctrlStateVal.innerText = "急停触发";
        ctrlStateVal.style.color = "var(--error)";
        resetStick();
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      } else {
        estopBtn.classList.remove('active');
        joystickWrapper.classList.remove('joystick-disabled');
        ctrlStateVal.innerText = "就绪";
        ctrlStateVal.style.color = "var(--text-main)";
        if (navigator.vibrate) navigator.vibrate(50);
      }
    });

    zone.addEventListener('touchstart', (e) => {
      if (isEstop) return;
      e.preventDefault();
      const rect = zone.getBoundingClientRect();
      centerX = rect.left + rect.width / 2;
      centerY = rect.top + rect.height / 2;
      isDragging = true;
      stick.classList.add('active');
      updateStickPosition(e.touches[0].clientX, e.touches[0].clientY);
    });

    zone.addEventListener('touchmove', (e) => {
      if (isEstop) return;
      e.preventDefault();
      if (!isDragging) return;
      updateStickPosition(e.touches[0].clientX, e.touches[0].clientY);
    });

    zone.addEventListener('touchend', (e) => {
      e.preventDefault();
      resetStick();
    });
    
    zone.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      resetStick();
    });

    zone.addEventListener('mousedown', (e) => {
      if (isEstop) return;
      const rect = zone.getBoundingClientRect();
      centerX = rect.left + rect.width / 2;
      centerY = rect.top + rect.height / 2;
      isDragging = true;
      stick.classList.add('active');
      updateStickPosition(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging || isEstop) return;
      updateStickPosition(e.clientX, e.clientY);
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) resetStick();
    });

    connect();
  </script>
</body>
</html>
